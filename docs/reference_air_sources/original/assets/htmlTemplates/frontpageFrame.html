<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01//EN">
<html>
<head>
    <title></title>
    <style>
        body {
            background-color: #000;
            padding: 0;
            margin: 0;
            overflow: hidden;
        }

        iframe {
            border: none;
            display: none;
        }
    </style>
    <!--http://help.adobe.com/en_US/AIR/1.5/devappshtml/WS5b3ccc516d4fbf351e63e3d118666ade46-7f11.html-->
    <script type="text/javascript" src="app:/assets/htmlTemplates/AIRAliases.js"></script>
    <script>
        var iframeLocation;
        var iframeOrigin;
        var isLoaded = false;
        var timeout = 5000;
        var timer;
        var fallbackUrl = "app:/assets/htmlTemplates/frontpageFallbackFrame.html";
        var childInterface;
        var parentInterface = {
            reload: function() {
                hideIframe();
                navigate(iframeLocation);
            },
            loaded: function() {
                childInterface = getSandbox().contentWindow.childSandboxBridge;
                showIframe();
            }
        };

        function checkContent() {
            if (!isLoaded) {
                showFallback();
            }
        }

        function hideIframe() {
            var sandbox = getSandbox();

            isLoaded = false;

            if (sandbox) {
                sandbox.style.display = "none";
            }

            parentInterface.hideFrontpage();
        }

        function showIframe() {
            var sandbox = getSandbox();

            isLoaded = true;

            if (sandbox) {
                sandbox.style.display = "block";
            }

            parentInterface.showFrontpage();
        }

        function showFallback() {
            navigate(fallbackUrl);
        }

        function setContentTimeout() {
            if (isLoaded) {
                return;
            }

            if (timer) {
                clearTimeout(timer);
            }

            timer = setTimeout(function() {
                checkContent();
            }, timeout);
        }

        function dispatchFrontpageEvent(type) {
            if (typeof type !== 'string') {
                return;
            }

            childInterface.dispatchEvent(type);
        }

        function createSandbox() {
            var body = document.getElementsByTagName("body")[0];
            var sandboxElement = document.createElement("iframe");

            sandboxElement.setAttribute("id", "sandbox");
            sandboxElement.setAttribute("documentRoot", "app:/assets/");
            sandboxElement.setAttribute("allowCrossDomainXHR", "allowCrossDomainXHR");
            sandboxElement.setAttribute("height", "100%");
            sandboxElement.setAttribute("width", "100%");

            body.appendChild(sandboxElement);
        }

        function getSandbox() {
            return document.getElementById("sandbox");
        }

        function destroySandbox() {
            var sandboxElement = document.getElementById("sandbox");

            if (sandboxElement) {
                sandboxElement.parentNode.removeChild(sandboxElement);
            }
        }

        function initializeFrontpage(origin, location) {
            iframeOrigin = origin;
            iframeLocation = location;

            navigate(location);
        }

        function navigate(location) {
            var sandboxRoot = iframeOrigin + "/client-assets";

            destroySandbox();
            createSandbox();

            parentInterface.clientAssetPath = sandboxRoot;

            getSandbox().contentWindow.parentSandboxBridge = parentInterface;
            getSandbox().setAttribute("sandboxRoot", sandboxRoot);
            getSandbox().setAttribute("src", location);

            setContentTimeout();
        }
    </script>
</head>
<body>
</body>
</html>
