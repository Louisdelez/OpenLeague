[workspace]
resolver = "2"
members = ["crates/core", "crates/server", "crates/client", "crates/font-raster"]
exclude = ["launcher/src-tauri"]
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
[workspace.dependencies]
openleague-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[patch.crates-io]
bevy_animation = { path = "vendor/bevy_animation" }
